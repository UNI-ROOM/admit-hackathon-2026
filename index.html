<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление жестами - День 1</title>
    
    <!-- Подключаем скрипты MediaPipe через официальный CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        /* 1. Темная, стильная тема */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* 2. Контейнер с абсолютным позиционированием элементов внутри */
        .video-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            background-color: #000;
        }

        /* Отзеркаливаем видео и canvas, чтобы пользователь видел себя как в зеркале */
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Зеркальное отражение по горизонтали */
            transform: scaleX(-1);
        }

        /* 3. Блок для вывода отладочной информации */
        #log {
            margin-top: 25px;
            padding: 20px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            width: 600px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 1.5;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Распознавание жестов</h1>
    
    <div class="video-container">
        <!-- Поток с веб-камеры -->
        <video id="input_video" autoplay playsinline></video>
        <!-- Слой для отрисовки скелета руки -->
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <!-- Вывод логов и дельты -->
    <div id="log">Загрузка модулей MediaPipe...</div>

    <script>
        // --- 1. Логика трекера движений (интегрирована из задания) ---
        class MovementTracker {
            constructor(timeWindowMs = 500) {
                this.history = [];
                this.timeWindow = timeWindowMs;
            }
            
            addPoint(xValue) {
                const now = Date.now();
                this.history.push({ x: xValue, time: now });
                // Фильтруем историю, оставляя только точки за последние timeWindowMs (500мс)
                this.history = this.history.filter(point => now - point.time <= this.timeWindow);
            }
            
            getDeltaX() {
                if (this.history.length < 2) return 0;
                // Считаем разницу между текущей (последней) координатой и самой старой в окне
                return this.history[this.history.length - 1].x - this.history[0].x;
            }
        }

        const tracker = new MovementTracker();

        // --- 2. Получение ссылок на DOM-элементы ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const logElement = document.getElementById('log');

        // --- 3. Инициализация и настройка MediaPipe Hands ---
        const hands = new Hands({locateFile: (file) => {
            // Указываем путь к бинарным файлам модели
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,               // Требуется отслеживать только одну руку
            modelComplexity: 1,           // 1 - хороший баланс производительности и точности
            minDetectionConfidence: 0.5,  // Порог уверенности для обнаружения
            minTrackingConfidence: 0.5    // Порог уверенности для трекинга
        });

        // Подписываемся на события готовности результатов
        hands.onResults(onResults);

        // --- 4. Обработка результатов (коллбэк) ---
        function onResults(results) {
            // Очищаем canvas перед отрисовкой нового кадра
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Если MediaPipe нашел руку
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0]; // Берем первую обнаруженную руку

                // Рисуем связи (линии костей) и ключевые точки (суставы)
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS,
                               {color: '#00FF00', lineWidth: 4});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2, radius: 3});

                // Получаем координату X запястья (индекс 0 - Wrist)
                // Координаты нормализованы от 0.0 до 1.0 (0 = левый край, 1 = правый край камеры)
                const wristX = landmarks[0].x;

                // Записываем точку в трекер движений
                tracker.addPoint(wristX);

                // Получаем дельту за последние 500мс
                const deltaX = tracker.getDeltaX();

                // Формируем логику отображения направления. 
                // Т.к. видео отзеркалено, визуальное восприятие свайпа может быть обратным от чистых данных.
                // При дельте > 0.05 или < -0.05 считаем это явным движением.
                let swipeDirection = 'Ожидание взмаха...';
                let dirColor = '#888';
                
                if (deltaX > 0.1) {
                    swipeDirection = 'Свайп влево <<< (относительно экрана)';
                    dirColor = '#4CAF50';
                } else if (deltaX < -0.1) {
                    swipeDirection = 'Свайп вправо >>> (относительно экрана)';
                    dirColor = '#2196F3';
                }

                // Выводим данные в лог
                logElement.innerHTML = `
                    <span style="color: #FF9800">Запястье (X):</span> ${wristX.toFixed(3)}<br>
                    <span style="color: #FF9800">Дельта (500мс):</span> ${deltaX.toFixed(3)}<br><br>
                    <strong style="color: ${dirColor}; font-size: 18px;">${swipeDirection}</strong>
                `;
            } else {
                // Если рука не в кадре
                logElement.innerHTML = "Рука не обнаружена. Покажите руку в камеру.";
                tracker.history = []; // Сбрасываем трекер, чтобы старые координаты не влияли на дельту
            }
            canvasCtx.restore();
        }

        // --- 5. Запуск веб-камеры ---
        // Используем встроенный класс Camera из MediaPipe (@mediapipe/camera_utils)
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                // Каждый кадр с камеры отправляем в модель Hands на обработку
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => {
                logElement.innerHTML = "Камера запущена. Ожидание руки...";
            })
            .catch(error => {
                logElement.innerHTML = "Ошибка доступа к камере: " + error.message;
            });
    </script>
</body>
</html>
