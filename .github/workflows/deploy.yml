name: Test, build containers and deploy ECHO
on:
  push:
    branches: [main, stage]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash
concurrency:
  group: echo-${{ github.ref }}
  cancel-in-progress: false
# Tests and image builds run in parallel; deploy waits for all of them.
# main deploys to production (vencera.jeanark.dev), stage to
# stage.vencera.jeanark.dev: same server, separate stack and database.
# Each test job skips its steps when its part of the repo is unchanged
# (manual runs always test everything).
jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web: ['echo/**', 'shared/**', '.github/workflows/**']
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: echo/package-lock.json
      - if: steps.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci --prefix echo
          npm test --prefix echo
          npm run build --prefix echo

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: echo_test
          POSTGRES_USER: echo_test
          POSTGRES_PASSWORD: echo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echo_test -d echo_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://echo_test:echo_test@127.0.0.1:5432/echo_test
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api: ['server/**', 'shared/**', '.github/workflows/**']
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci --prefix server
          npm run check --prefix server
          npm test --prefix server

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: echo/Dockerfile
          target: prod
          tags: echo-web:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=echo-web
          cache-to: type=gha,mode=max,scope=echo-web
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          tags: echo-api:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=echo-api
          cache-to: type=gha,mode=max,scope=echo-api
      - name: Start full stack and check routing
        env:
          POSTGRES_PASSWORD: ci-integration-only
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -c /tmp/echo-cookie -X POST http://127.0.0.1:8080/api/session
          curl -fsS -b /tmp/echo-cookie http://127.0.0.1:8080/api/me
      - name: Container logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-integration-only
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose logs --tail 100
      - name: Package immutable images
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'stage')
        run: docker save "echo-web:$GITHUB_SHA" "echo-api:$GITHUB_SHA" | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'stage')
        with:
          name: images-${{ github.sha }}
          path: images.tar.gz
          retention-days: 7
          compression-level: 0

  deploy:
    if: false
    needs: [test-web, test-api, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'stage' }}
      url: ${{ github.ref_name == 'main' && 'https://vencera.jeanark.dev' || 'https://stage.vencera.jeanark.dev' }}
    env:
      TARGET_DIR: ${{ github.ref_name == 'main' && '/srv/echo/containers' || '/srv/echo-stage/containers' }}
      PROJECT: ${{ github.ref_name == 'main' && 'echo' || 'echo-stage' }}
      SITE: ${{ github.ref_name == 'main' && 'https://vencera.jeanark.dev' || 'https://stage.vencera.jeanark.dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            deploy/release.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Install pinned host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy tested images
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az images.tar.gz "$SSH_USER@$SSH_HOST:$TARGET_DIR/images.tar.gz"
          rsync -az docker-compose.yml "$SSH_USER@$SSH_HOST:$TARGET_DIR/compose.release.yml"
          rsync -az deploy/release.sh "$SSH_USER@$SSH_HOST:$TARGET_DIR/release.sh"
          ssh "$SSH_USER@$SSH_HOST" "bash $TARGET_DIR/release.sh '$GITHUB_SHA' '$PROJECT'"
          curl -fsS --retry 5 --retry-delay 2 "$SITE/api/health"
