name: Test, build containers and deploy ECHO
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: echo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: echo_test
          POSTGRES_USER: echo_test
          POSTGRES_PASSWORD: echo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echo_test -d echo_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://echo_test:echo_test@127.0.0.1:5432/echo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            echo/package-lock.json
            server/package-lock.json
      - run: npm ci --prefix echo
      - run: npm test --prefix echo
      - run: npm run build --prefix echo
      - run: npm ci --prefix server
      - run: npm run check --prefix server
      - run: npm test --prefix server

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build separate frontend and API images
        run: |
          docker build -f echo/Dockerfile --target prod -t "echo-web:$GITHUB_SHA" .
          docker build -f server/Dockerfile -t "echo-api:$GITHUB_SHA" .
      - name: Start full stack and check routing
        env:
          POSTGRES_PASSWORD: ci-integration-only
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -c /tmp/echo-cookie -X POST http://127.0.0.1:8080/api/session
          curl -fsS -b /tmp/echo-cookie http://127.0.0.1:8080/api/me
      - name: Container logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-integration-only
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose logs --tail 100
      - name: Package immutable images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "echo-web:$GITHUB_SHA" "echo-api:$GITHUB_SHA" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: images-${{ github.sha }}
          path: images.tar.gz
          retention-days: 7
          compression-level: 0

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Install pinned host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy tested images
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az images.tar.gz "$SSH_USER@$SSH_HOST:/srv/echo/containers/images.tar.gz"
          rsync -az docker-compose.yml "$SSH_USER@$SSH_HOST:/srv/echo/containers/compose.release.yml"
          rsync -az deploy/release.sh "$SSH_USER@$SSH_HOST:/srv/echo/containers/release.sh"
          ssh "$SSH_USER@$SSH_HOST" "bash /srv/echo/containers/release.sh '$GITHUB_SHA'"
          curl -fsS --retry 5 --retry-delay 2 https://vencera.jeanark.dev/api/health
