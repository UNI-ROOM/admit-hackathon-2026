services:
  echo-game:
    build:
      context: .
      dockerfile: echo/Dockerfile
      target: dev
    container_name: echo-game
    volumes:
      - ./echo:/app/echo
      - ./shared:/app/shared:ro
      - /app/echo/node_modules
    ports:
      - "127.0.0.1:${PORT:-5173}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
