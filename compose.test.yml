name: echo-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: echo_test
      POSTGRES_USER: echo_test
      POSTGRES_PASSWORD: echo_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U echo_test -d echo_test']
      interval: 2s
      timeout: 2s
      retries: 30
