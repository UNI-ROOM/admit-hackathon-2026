<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b101b">
    <title>Vencera Echo Game</title>
    <meta name="description" content="Vencera Echo Game — cooperate with your past self using only a webcam. Built at ADMIT Hackathon 2026.">
    <meta property="og:title" content="Vencera Echo Game">
    <meta property="og:description" content="Cooperate with your past self using only a webcam. Built at ADMIT Hackathon 2026.">
    <meta property="og:image" content="/brand/admit-hackathon.jpg">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com" defer></script>
</head>
<body>
    <section id="scene-menu" class="scene menu-scene"></section>
    <section id="scene-modes" class="scene modes-scene" hidden></section>
    <section id="scene-levels" class="scene levels-scene" hidden></section>
    <section id="scene-game3d" hidden></section>

    <div id="game-container" hidden>
        <video id="webcam" autoplay playsinline muted></video>
        <div id="canvas-stage"><canvas id="game-canvas" aria-label="2D puzzle playfield"></canvas></div>

        <div id="ui-layer">
            <div class="game-header flex justify-between w-full">
                <div class="status-box">
                    <h1 class="hud-title">VENCERA ECHO GAME</h1>
                    <p id="level-title" class="text-sm text-gray-400 mt-1 uppercase tracking-widest">Tutorial</p>
                    <button id="hud-menu-button" type="button" data-dwell class="hud-menu-btn">☰ MENU</button>
                </div>
                <div id="mode-indicator" class="status-box text-2xl font-bold flex items-center justify-center min-w-[250px] text-yellow-400">TUTORIAL 1/4</div>
            </div>
            <div class="game-footer text-center mb-8">
                <div id="touch-progress" hidden><span id="touch-goal"></span><span id="touch-puzzle-status"></span></div>
                <div id="round-actions" class="round-actions" hidden>
                    <button id="play-button" type="button" data-dwell class="hud-menu-btn"></button>
                    <button id="record-button" type="button" data-dwell class="hud-menu-btn"></button>
                </div>
                <p id="instruction" class="instruction-box">
                    Pinch your fingers together to grab objects. Show your palm to start!
                </p>
                <div id="touch-tools" hidden>
                    <button id="touch-tutorial-button" type="button" class="hud-menu-btn" hidden></button>
                    <button id="touch-restart-button" type="button" class="hud-menu-btn"></button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
